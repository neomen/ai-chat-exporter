name: Validate Manifest

on:
  push:
    branches: [ main, master ]
    paths:
      - 'manifest.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'manifest.json'
  workflow_dispatch:

jobs:
  validate:
    name: Validate manifest.json (Chrome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache global npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-global-npm-ajv-cli
          restore-keys: |
            ${{ runner.os }}-global-npm-

      - name: Install AJV CLI
        run: npm install -g ajv-cli

      - name: Cache Chrome manifest schema
        uses: actions/cache@v4
        with:
          path: chrome-manifest-schema.json
          key: ${{ runner.os }}-chrome-schema-v1
          restore-keys: |
            ${{ runner.os }}-chrome-schema-

      - name: Fetch Chrome manifest schema
        run: |
          if [ ! -f chrome-manifest-schema.json ]; then
            curl -sSL -o chrome-manifest-schema.json \
              https://raw.githubusercontent.com/GoogleChrome/chrome-extensions-samples/main/_schema/manifest.json
          else
            echo "✅ Using cached schema"
          fi

      - name: Validate manifest against Chrome schema
        run: |
          echo "🔍 Validating manifest.json against Chrome schema..."
          ajv validate -s chrome-manifest-schema.json -d manifest.json --strict=false

      - name: Check JSON formatting
        run: |
          echo "🎨 Checking JSON formatting..."
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8')); console.log('✅ manifest.json is valid JSON')"