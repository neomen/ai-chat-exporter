name: Build and Package Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive
        run: |
          # Creating a zip archive from the current directory, excluding development files
          zip -r ai-chat-exporter.zip . \
            -x "*.git*" \
            -x "*.github*" \
            -x "*.md" \
            -x "LICENSE" \
            -x ".gitignore" \
            -x ".DS_Store" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "node_modules/*" \
            -x "yarn.lock" \
            -x "pnpm-lock.yaml"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-exporter-${{ github.ref_name }}
          path: ai-chat-exporter.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ai-chat-exporter.zip
          generate_release_notes: true
          draft: false